name: ci

on:
  push:
    branches: [main]
    paths:
      - pyproject.toml
      - uv.lock
      - .python-version
      - src/**
      - tests/**
      - prompts/**
      - scripts/**
      - site/package*.json
      - atlas/**
      - .github/workflows/**
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Python 3.15, the only supported version (requires-python >=3.15): coverage with its floor, then the Atlas check.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.15"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run pytest with coverage (floor 90%)
        run: uv run pytest -n auto -v -rfE --durations=30 --cov=udlab_generator --cov-report=term-missing --cov-report=xml --cov-fail-under=90

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          version: v11.3.1
          use_oidc: true
          fail_ci_if_error: false
          disable_search: true
          files: coverage.xml

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Atlas check
        run: npx --yes @dogfood-lab/atlas@1.24.0 check

      - name: Audit the site's npm tree
        working-directory: site
        run: npm ci && npm audit --audit-level=high
