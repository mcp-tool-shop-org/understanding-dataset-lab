[project]
name = "udlab-generator"
version = "0.1.0"
description = "udlab release-1 scenario generator, writer prompt, sealing, and shortcut probe"
readme = "README.md"
requires-python = ">=3.15"
dependencies = []

[project.scripts]
udlab-gen = "udlab_generator.cli:console_main"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.0.0",
    "pytest-xdist==3.8.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
